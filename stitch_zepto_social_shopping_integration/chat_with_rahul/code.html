</div>

<script>
        // Micro-interaction for Add buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.innerText.includes('ADD')) {
                    const originalText = btn.innerHTML;
                    btn.classList.replace('text-secondary', 'text-white');
                    btn.classList.add('bg-secondary');
                    btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span> ADDED';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.classList.replace('text-white', 'text-secondary');
                        btn.classList.remove('bg-secondary');
                    }, 2000);
                }
            });
        });

        // Hide floating cart on scroll down, show on scroll up
        let lastScrollTop = 0;
        const floatingCart = document.querySelector('.fixed.bottom-24.right-4');
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop) {
                floatingCart.style.transform = 'translateY(150px)';
                floatingCart.style.transition = 'transform 0.3s ease-out';
            } else {
                floatingCart.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop;
        });
    </script>
